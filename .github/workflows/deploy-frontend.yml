name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: Xomware/github-actions/.github/workflows/deploy-frontend-s3.yml@feature/nextjs-upload
    with:
      app: derby
      role-key: AWS_DEPLOY_ROLE_ARN
      node-version: '22'
      root: frontend
      build-command: NEXT_PUBLIC_API_URL=https://api.derby.xomware.com npm run build
      dist-dir: out
      bucket: derby.xomware.com
      domain: derby.xomware.com
      nextjs: true
